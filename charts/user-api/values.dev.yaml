user-api:
  replicaCount: 1
  image:
    repository: haeseung/user-api
    tag: v0.0.1
    pullPolicy: IfNotPresent
  configmap:
    enabled: true
    values:
      SPRING_PROFILES_ACTIVE: dev
      config_host: ml-config-rollout-active-svc.ml-dev # configmap
  ingress:
    enabled: false
    className: nginx
  envFrom:
    - configMapRef:
        name: pay-test-user-api-cm
    - secretRef:
        name: config-key-scr

  rollout:
    strategy:
      blueGreen:
        autoPromotionEnabled: true
  secrets:
    enabled: false
  otel:
    exporterEndpoint: "http://monitoring-opentelemetry-collector.logging:4317"


